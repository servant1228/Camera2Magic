// 版本控制变量 version for camera3
def majorVersion = 2
def minorVersion = 0
def patchVersion = 0
def versionCodeOffset = 0 // 保持与旧版本兼容的偏移量

def getGitCommitHash = { ->
    try {
        return 'git rev-parse --short HEAD'.execute().text.trim()
    } catch (Exception ignored) {
        return "unknown"
    }
}

def getGitCommitCount = { ->
    try {
        def count = 'git rev-list --count HEAD'.execute().text.trim()
        return count.isEmpty() ? 1 : count.toInteger()
    } catch (Exception ignored) {
        return 1
    }
}

def gitCommitHash = getGitCommitHash()
def gitCommitCount = getGitCommitCount()

def startTasks = gradle.startParameter.taskNames
def isExplicitNativeBuild = startTasks.any { it.contains("buildNative") }
def hasNativeSource = file("src/main/cpp/CMakeLists.txt").exists()

// ---- Release 签名解析（优先级：CI secrets > 本地 keystore.properties）----
def signingStoreFile = null
def signingStorePassword = null
def signingKeyAlias = null
def signingKeyPassword = null

def envKeystoreB64 = System.getenv("CAM2MAGIC_KEYSTORE_B64")
def envKeystorePath = System.getenv("CAM2MAGIC_KEYSTORE")
if (envKeystoreB64) {
    def ksDir = file("${buildDir}/cam2magic-keystore")
    ksDir.mkdirs()
    def ksFile = new File(ksDir, "cam2magic.keystore")
    ksFile.bytes = envKeystoreB64.decodeBase64()
    signingStoreFile = ksFile
    signingStorePassword = System.getenv("CAM2MAGIC_KEYSTORE_PASSWORD")
    signingKeyAlias = System.getenv("CAM2MAGIC_KEY_ALIAS")
    signingKeyPassword = System.getenv("CAM2MAGIC_KEY_PASSWORD")
} else if (envKeystorePath) {
    def ksFile = file(envKeystorePath)
    if (!ksFile.exists()) {
        throw new GradleException("CAM2MAGIC_KEYSTORE 不存在: ${ksFile.absolutePath}")
    }
    signingStoreFile = ksFile
    signingStorePassword = System.getenv("CAM2MAGIC_KEYSTORE_PASSWORD")
    signingKeyAlias = System.getenv("CAM2MAGIC_KEY_ALIAS")
    signingKeyPassword = System.getenv("CAM2MAGIC_KEY_PASSWORD")
} else {
    def propsFile = file("keystore.properties")
    if (propsFile.exists()) {
        def props = new Properties()
        propsFile.withInputStream { props.load(it) }
        signingStoreFile = file(props.getProperty("storeFile"))
        signingStorePassword = props.getProperty("storePassword")
        signingKeyAlias = props.getProperty("keyAlias")
        signingKeyPassword = props.getProperty("keyPassword")
    }
}

def hasReleaseSigning = signingStoreFile != null && signingStoreFile.exists() &&
        signingStorePassword != null && signingKeyAlias != null && signingKeyPassword != null

if (hasReleaseSigning) {
    println ">>> Release 签名已配置: ${signingStoreFile.name} <<<"
} else {
    println ">>> [警告] 未找到 Release 签名（CI secrets 或 app/keystore.properties），将产出未签名 APK <<<"
}

android {

    namespace 'com.nothing.camera2magic'
    compileSdk {
        version = release(37)
    }
    // 原生源码仅本地保留（不入库）；此版本号仅供本机 buildNative 使用
    ndkVersion = "29.0.14206865"

    defaultConfig {
        applicationId "com.nothing.camera2magic"
        minSdk 33
        targetSdk 36

//        ndk {
//            abiFilters "armeabi-v7a", "arm64-v8a"
//        }

        // versionCode = 偏移量 + Git提交次数，确保比旧版本大
        versionCode versionCodeOffset + gitCommitCount
        versionName "${majorVersion}.${minorVersion}.${patchVersion}"

        if (hasNativeSource) {
            externalNativeBuild {
                cmake {
                    cppFlags += ""
                    arguments "-DANDROID_PLATFORM=android-29", "-DANDROID_STL=c++_static"
                }
            }
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    splits {
        abi {
            enable true
            reset()
            include ("arm64-v8a")
            universalApk false
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile signingStoreFile
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // 自定义生成的 APK 文件名
    androidComponents {
        onVariants(selector().all(), { variant ->
            variant.outputs.each { output ->
                def abi = output.filters.find {
                    it.filterType == FilterConfiguration.FilterType.ABI
                }?.identifier
                def fileName = "CAM2Magic-${majorVersion}.${minorVersion}.${patchVersion}-${abi}.apk"
                output.outputFileName.set(fileName)
            }
        })
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlin {
        compilerOptions {
            jvmTarget.set(JvmTarget.JVM_11)
        }
    }

    buildFeatures {
        compose true
        aidl true
        buildConfig true
    }

    sourceSets {
        main {
            jniLibs {
                srcDirs += ["src/main/jniLibs"]
            }
        }
    }

    // 公开仓库不含 app/src/main/cpp；仅当本地存在原生源码时才启用 CMake 配置
    if (hasNativeSource) {
        externalNativeBuild {
            cmake {
                path file("src/main/cpp/CMakeLists.txt")
                version = "3.22.1"
            }
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
        jniLibs.pickFirsts.add("**/libcamera3.so")
    }
}

if (hasNativeSource) {
    afterEvaluate {
        if (!isExplicitNativeBuild) {
            def jniLibTree = fileTree(dir: "src/main/jniLibs", include: "**/libcamera3.so")
            if (jniLibTree.isEmpty()) {
                println ">>> [警告] jniLibs 文件不存在， 无法快速编译 <<<"
                return
            }

            println ">>> 模式: 快速编译 (C++ 编译已禁用，使用 jniLibs) <<<"
            // 1. 禁用 CMake 和 Strip 任务
            tasks.matching { task ->
                (task.name.startsWith("buildCMake") || task.name.startsWith("externalNativeBuild")) &&
                        !task.name.contains("generateJsonModel")
            }.configureEach { task ->
                task.enabled = false
            }
        } else {
            // Native 构建模式：合并 jniLibs 前先清掉旧 .so，避免旧产物被拷回
            tasks.named("mergeReleaseNativeLibs").configure { dependsOn("cleanOldJniLibs") }
            tasks.named("mergeReleaseJniLibFolders").configure { dependsOn("cleanOldJniLibs") }
        }
    }

    tasks.register("buildNative", Copy) {
        group = "native"
        description = "编译 C++ 产物并同步到 jniLibs (基于 Modern Release)"

        def targetVariant = "release"
        def stripTaskName = "stripReleaseDebugSymbols"

        // strip task may not exist in fast-build mode; only depend on it when present
        dependsOn tasks.matching { it.name == stripTaskName }
        outputs.upToDateWhen { false }
        duplicatesStrategy = DuplicatesStrategy.INCLUDE

        doFirst {
            def cmakeFile = file("src/main/cpp/CMakeLists.txt")
            if (!cmakeFile.exists()) {
                throw new GradleException(
                    ">>> buildNative failed: missing src/main/cpp/CMakeLists.txt, cannot build libcamera3.so <<<" +
                    " (restore C++ sources or clone them back locally; source is not in the public repo)"
                )
            }
            delete("src/main/jniLibs")
            delete("release/")
            delete(".cxx")
            println ">>> 已清理旧的 jniLibs 目录和 C++ 缓存 <<<"
            println ">>> 模式: Native 构建 (基于 ${targetVariant} 编译 C++ 并更新 jniLibs) <<<"
        }

        def startDir = layout.buildDirectory.dir("intermediates/stripped_native_libs/${targetVariant}/${stripTaskName}/out/lib")

        from(startDir) {
            include("**/libcamera3.so")
        }

        includeEmptyDirs = false
        into("src/main/jniLibs")
    }

    // buildNative 前置清理：必须在 merge/strip 之前删掉旧 jniLibs，
    // 否则 mergeReleaseNativeLibs 会优先采用旧的 libcamera3.so（buildNative 的
    // doFirst 删除时机太晚，发生在依赖任务之后）。
    tasks.register("cleanOldJniLibs") {
        group = "native"
        description = "删除 src/main/jniLibs，确保 buildNative 只使用 CMake 新产物"
        doLast {
            delete("src/main/jniLibs")
            println ">>> 已清理旧 jniLibs（buildNative 前置）<<<"
        }
    }
}

