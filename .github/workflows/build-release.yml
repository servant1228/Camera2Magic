name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

# 同一 ref 只保留最新一次构建：重复触发自动取消未跑完的旧 run
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # 需要完整历史：versionCode = git 提交数（git rev-list --count HEAD）
          fetch-depth: 0

      - name: Verify tag matches versionName
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          major=$(sed -nE 's/^def majorVersion = ([0-9]+).*/\1/p' app/build.gradle)
          minor=$(sed -nE 's/^def minorVersion = ([0-9]+).*/\1/p' app/build.gradle)
          patch=$(sed -nE 's/^def patchVersion = ([0-9]+).*/\1/p' app/build.gradle)
          if [ -z "${major}" ] || [ -z "${minor}" ] || [ -z "${patch}" ]; then
            echo "::error::无法从 app/build.gradle 解析 majorVersion/minorVersion/patchVersion"
            exit 1
          fi
          version_name="${major}.${minor}.${patch}"
          tag="${GITHUB_REF_NAME#v}"
          if [ "${tag}" != "${version_name}" ]; then
            echo "::error::tag '${GITHUB_REF_NAME}' 与 app/build.gradle 的 versionName '${version_name}' 不一致"
            exit 1
          fi
          echo "tag/versionName 一致：${GITHUB_REF_NAME} == ${version_name}"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (cached)
        # v6 起缓存组件改为专有许可（gradle-actions-caching）且移除了配置缓存支持，故停在 v5
        uses: gradle/actions/setup-gradle@v5

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.CAM2MAGIC_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/cam2magic.keystore"
          test -s "$RUNNER_TEMP/cam2magic.keystore"

      - name: Build signed release APK
        env:
          CAM2MAGIC_KEYSTORE: ${{ runner.temp }}/cam2magic.keystore
          CAM2MAGIC_KEYSTORE_PASSWORD: ${{ secrets.CAM2MAGIC_KEYSTORE_PASSWORD }}
          CAM2MAGIC_KEY_ALIAS: ${{ secrets.CAM2MAGIC_KEY_ALIAS }}
          CAM2MAGIC_KEY_PASSWORD: ${{ secrets.CAM2MAGIC_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -x lintVitalRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: cam2magic-release-apk
          path: app/build/outputs/apk/release/*.apk
